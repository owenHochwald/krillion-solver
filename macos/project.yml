name: KrillionBar
options:
  bundleIdPrefix: io.krillion.solver
  deploymentTarget:
    macOS: "14.0"
targets:
  KrillionBar:
    type: application
    platform: macOS
    sources:
      - path: KrillionBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.krillion.solver.bar
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Krillion Bar
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - KrillionBarTests
  KrillionBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KrillionBarTests
    dependencies:
      - target: KrillionBar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
