<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061623">
  <meta name="description" content="Today's Krillion prompts and best available answers.">
  <title>Krillion Solver</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="masthead">
      <div class="brand">KRILLION SOLVER</div>
      <a class="source-link" href="https://github.com/owenHochwald/krillion-solver" aria-label="View source on GitHub" title="View source on GitHub"><img src="./github.svg" alt="" width="20" height="20"></a>
    </header>

    <main>
      <section class="dashboard" aria-label="Daily answers">
        <div class="dashboard-head">
          <div><h1 id="dive-title">Loading today's dive…</h1><p id="dive-meta" class="muted">Following the current.</p></div>
          <div class="head-actions"><button id="refresh" class="icon-button" type="button" title="Refresh answers" aria-label="Refresh answers">↻</button><button id="copy-all" class="button button-secondary" type="button" disabled>Copy all answers</button></div>
        </div>
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div class="dashboard-body">
          <nav class="round-nav" aria-label="Rounds"><div class="panel-label">THE CATCH <span id="round-count">00 / 07</span></div><div id="round-list" class="round-list"></div></nav>
          <section id="answer-panel" class="answer-panel" aria-live="polite"><div class="empty-state"><span class="spinner" aria-hidden="true"></span><p>Descending into today's dive…</p></div></section>
        </div>
        <div class="dashboard-foot"><span id="reset-time"></span></div>
      </section>
      <p class="disclaimer">Unofficial companion to <a href="https://krillion.io/">Krillion</a>. Answers reveal the daily puzzle.</p>
    </main>
  </div>
</body>
</html>
